[project]
name = "ohm-hdl"
version = "0.1.0"
description = "Ohm — AI-native, physics-aware hardware description language and hermetic compiler"
requires-python = ">=3.12"
dependencies = ["lark>=1.1"]

[project.optional-dependencies]
# linters pinned exactly: their rulesets drift release-to-release, and the CI
# gate must reproduce the local gate byte-for-byte (upgrade deliberately)
dev = ["pytest>=8", "ruff==0.15.22", "mypy==2.3.0"]

[project.scripts]
ohm = "ohm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ohm", "ohm.pkggen", "shared"]

[tool.setuptools.package-data]
ohm = ["*.lark", "std/*.ohm", "templates/*"]

[tool.mypy]
python_version = "3.12"
files = ["ohm", "shared"]

[[tool.mypy.overrides]]
module = "lark.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"
