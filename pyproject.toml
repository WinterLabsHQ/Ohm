[project]
name = "ohm-hdl"
version = "0.1.1"
description = "Ohm — AI-native, physics-aware hardware description language and hermetic compiler"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — see LICENSE" }
authors = [{ name = "WinterLabs", email = "admin@upcheck.in" }]
keywords = ["hdl", "eda", "electronics", "kicad", "hardware", "netlist", "pcb", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["lark>=1.1"]

[project.urls]
Homepage = "https://github.com/WinterLabsHQ/Ohm"
Repository = "https://github.com/WinterLabsHQ/Ohm"
Changelog = "https://github.com/WinterLabsHQ/Ohm/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# linters pinned exactly: their rulesets drift release-to-release, and the CI
# gate must reproduce the local gate byte-for-byte (upgrade deliberately)
# olefile is TEST-ONLY and deliberately not a runtime dependency: `ohm` writes the
# Altium compound-file container itself (ohm/pkggen/cfb.py). It is here so the test
# suite reads that container back with an implementation Ohm did not write — a
# self-written reader would agree with a self-written writer about a broken file.
# gmsh is TEST-ONLY, and it is the ONLY reader in the suite that opens a file
# Ohm emits with an implementation Ohm did not write: it meshes the .step body
# through OpenCASCADE, which only succeeds on a watertight, correctly-oriented
# shell, and the volume is then checked to rel=1e-9. It was absent from here,
# so a fresh checkout skipped the STEP oracle -- which is exactly how the AP214
# schema went unexamined until 2026-08-31.
dev = ["pytest>=8", "ruff==0.15.22", "mypy==2.3.0", "olefile==0.47", "gmsh>=4.13"]

[project.scripts]
ohm = "ohm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ohm", "ohm.fpdata", "ohm.pkggen", "shared"]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
ohm = ["*.lark", "std/*.ohm", "templates/*", "fpdata/*.json.gz"]

[tool.pytest.ini_options]
# There was no pytest configuration at all until now: no testpaths, no marker
# registration, no strictness. The suite gates every change (AGENTS.md), so the
# ways it can quietly stop gating are worth closing.
#   --strict-markers  a typo'd @pytest.mark.foo is an error, not a silent no-op
#   --strict-config   an unknown key here is an error, not ignored
#   xfail_strict      an xfail that starts passing FAILS, so a fixed bug cannot
#                     leave a permanently-green test that proves nothing
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true

[tool.mypy]
python_version = "3.12"
# tools/ is author-time acquisition, off the build path — but it writes the pad
# table `ohm check` reads (ADR-021), so it is gated like everything else.
files = ["ohm", "shared", "tools"]

[[tool.mypy.overrides]]
module = "lark.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"
