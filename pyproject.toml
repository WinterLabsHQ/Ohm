[project]
name = "ohm-hdl"
version = "0.1.0"
description = "Ohm — AI-native, physics-aware hardware description language and hermetic compiler"
requires-python = ">=3.12"
dependencies = ["lark>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ohm = "ohm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ohm", "ohm.pkggen", "shared"]
