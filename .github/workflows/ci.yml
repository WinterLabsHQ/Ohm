name: ci

# `fast` gates every push and PR. The KiCad jobs pull a ~1.5 GB image and are
# deliberately kept off that path: compatibility with a program Ohm does not ship
# changes on KiCad's release cadence, not on Ohm's, so it is checked weekly, on
# demand, and at every tag — not on every commit.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"        # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # The gate that must stay fast. No KiCad, no container pull.
  # ------------------------------------------------------------------
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check ohm/ shared/ tests/ tools/
      - run: mypy
      - run: pytest -q

  # ------------------------------------------------------------------
  # Ohm's output, read by real KiCad. Everything inside one image, so the
  # binary and the symbol/footprint libraries are the same version by
  # construction — the failure mode where a KiCad 10 binary is checked
  # against KiCad 8 libraries cannot occur.
  #
  # KiCad 7 IS containerised, contrary to what this file and four other
  # documents asserted until 2026-08-31: `kicad/kicad:7.0.11` exists (pushed
  # 2024-02-23, linux/amd64, 440 MB), built from `Dockerfile.7.0-stable` in the
  # same kicad-cli-docker repo as 8, 9 and 10 and cloning kicad-symbols and
  # kicad-footprints at the matching `7.0` branch — so the binary and the
  # libraries agree by construction here too. The claim came from reading page
  # one of Docker Hub's tag listing, which is ordered by `last_updated` and
  # returns 50 rows; 7.x was last pushed in February 2024 and falls off it.
  # `tools/check_kicad_tags.py` paginates properly and is what found the error.
  #
  # What the 7 leg covers: every gate below, with no step excluded and no step
  # made conditional. `sch export netlist`, `pcb export pos`, `pcb export
  # gerbers`, `pcb export drill`, `sch export pdf` and `sym upgrade` all predate
  # KiCad 8, so there is no capability here that 7 lacks. What it does NOT
  # cover: `kicad-cli pcb upgrade`, which is KiCad 10 only — the read-back gate
  # re-saves through `pcbnew` at 7 exactly as it already does at 8 and 9 — and
  # the in-process geometry gate, which is one version everywhere (`v007`).
  # ------------------------------------------------------------------
  kicad:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: kicad/kicad:${{ matrix.kicad }}
    strategy:
      fail-fast: false          # one version failing must not hide the others
      matrix:
        kicad: ["7.0.11", "8.0.9", "9.0.9", "10.0.5"]
    env:
      # A skipped test is not a passed test. Without this the job is green when
      # KiCad is missing, which is the exact failure this job exists to prevent:
      # a certification run that certified nothing. See tests/conftest.py.
      OHM_REQUIRE_KICAD: "1"
      HOME: /github/home        # kicad-cli writes its config on first run
      PYTHONUTF8: "1"
    steps:
      - name: Container prerequisites
        # The image is a kicad-cli runtime, not a build environment: it has
        # neither git (which actions/checkout prefers) nor curl (which the uv
        # installer needs).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates

      - uses: actions/checkout@v4

      - name: Python 3.12
        # KiCad 7, 8 and 9 are Debian 12 bookworm -> Python 3.11; KiCad 10 is
        # Debian 13 -> Python 3.13. Ohm is requires-python >= 3.12, so no image
        # interpreter in the matrix will do: 3.11 is too old and 3.13 is not the
        # version the rest of the repo is tested on. uv fetches a standalone
        # 3.12 and is already this repo's lock tool.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Ohm
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Record what is under test
        # A test report that does not name the KiCad it ran against cannot be
        # used as evidence afterwards.
        run: |
          kicad-cli version
          ls -d /usr/share/kicad/footprints /usr/share/kicad/symbols

      - name: Emit gates — KiCad reads what Ohm writes
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_schematic_roundtrip.py \
            tests/test_pkggen.py \
            tests/test_placement.py \
            tests/test_lower_emit.py \
            tests/test_fixes_w3_parser.py

      - name: Library gates — the parts Ohm names still exist
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_import_symbol.py \
            tests/test_provenance.py \
            tests/test_verify_footprints.py \
            tests/test_std_analog.py \
            tests/test_std_connect.py \
            tests/test_std_connectors.py \
            tests/test_std_discrete.py \
            tests/test_std_discrete_ext.py \
            tests/test_std_magnetics.py \
            tests/test_std_opto_ext.py \
            tests/test_std_passives.py \
            tests/test_std_pcb.py

      - name: Read-back and plot gates
        # Split out so a failure here reads as "KiCad changed what it WRITES",
        # distinct from the emit gates' "KiCad changed what it READS".
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_signoff_readback.py \
            tests/test_kicad_plot.py

      - name: Version-resolution gates — discovery and the shipped pad table
        # These need no KiCad to pass, but they are the code that DECIDES which
        # KiCad the rest of the suite talks to, and which pad ids it expects. Run
        # them where a real KiCad exists so a resolver that answers correctly on a
        # bare runner and wrongly in front of an installation cannot hide.
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_kicad_env.py \
            tests/test_fpdata.py

      - name: Dump this KiCad's footprint pad ids
        # Feeds the `fpdata` job below. Ohm ships a table of these because a
        # `package = "Lib:Footprint"` reference emits a pad-LESS stub and only
        # the pad id travels — so a pad KiCad renamed silently unbinds a pin.
        #
        # Runs at 7 as well, deliberately. The matrix and the committed table
        # must name the same majors: the `fpdata` job below rebuilds the table
        # from every dump this matrix produced and fails on any difference, so a
        # 7 leg without 7 in `ohm/fpdata/pads.json.gz` and a table with 7 that
        # no leg dumps BOTH report the table out of date. That is the gate
        # working — a matrix version whose libraries nothing has read is exactly
        # the state it exists to make visible — so the two land together.
        run: |
          python3 tools/gen_fpdata.py dump "${{ matrix.kicad }}" \
            "pads-$(echo '${{ matrix.kicad }}' | cut -d. -f1).json"

      - uses: actions/upload-artifact@v4
        with:
          name: fpdump-${{ matrix.kicad }}
          path: pads-*.json

  # ------------------------------------------------------------------
  # V007 — the geometry gate, which imports pcbnew IN-PROCESS. Only runs
  # where the system Python matches Ohm's: ubuntu-24.04 is 3.12 and the
  # KiCad 10 PPA builds pcbnew against it. `ubuntu-latest` is deliberately
  # NOT used here — when that label moves to a newer Ubuntu the system
  # Python moves with it and pcbnew silently stops importing.
  # ------------------------------------------------------------------
  v007:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      OHM_REQUIRE_KICAD: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: KiCad 10 from the PPA
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --install-recommends kicad
          kicad-cli version
          python3 -c "import pcbnew; print('pcbnew', pcbnew.GetBuildVersion())"

      - name: Install Ohm against the system interpreter
        # --system-site-packages so the venv can see KiCad's pcbnew. ohm/drc.py
        # also appends /usr/lib/python3/dist-packages itself, but requiring both
        # means a failure here is a real failure, not a path accident.
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Geometry gate
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_signoff.py \
            tests/test_drc_gate.py

  # ------------------------------------------------------------------
  # The shipped pad table must not rot. Rebuild it from the libraries the
  # matrix just read and fail if it differs from what is committed — the
  # KiCad 10 shield rename (163 footprints, `11`/`6`/`S1` -> `SH`) reached
  # users precisely because nothing noticed a library had changed.
  # ------------------------------------------------------------------
  fpdata:
    if: github.event_name != 'pull_request'
    needs: [kicad]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: fpdump-*
          merge-multiple: true
          path: dumps
      - name: Rebuild and compare
        # The build is byte-reproducible (sorted keys, gzip mtime=0), so any
        # difference is a real library change, never churn.
        run: |
          python tools/gen_fpdata.py build ohm/fpdata/pads.json.gz dumps/pads-*.json
          if ! git diff --quiet -- ohm/fpdata/pads.json.gz; then
            echo "::error::ohm/fpdata/pads.json.gz is out of date — a KiCad library changed."
            echo "Regenerate it and read the diff before committing: a renamed pad silently"
            echo "unbinds a pin on every board that names the old id."
            git --no-pager diff --stat -- ohm/fpdata/pads.json.gz
            exit 1
          fi
          echo "pad table matches the installed libraries at every matrix version"

  # ------------------------------------------------------------------
  # The matrix pins images; KiCad keeps releasing. A pin is only as honest as
  # it is current — the day KiCad ships a release that has an image and the
  # matrix does not name it, this repo certifies a version nobody runs any more
  # and says nothing about the one they do. Nothing noticed that before, and
  # nothing would have noticed when the image appeared.
  #
  # Kept OFF the certify chain on purpose. A KiCad release must not invalidate
  # the certification of what actually ran; drift is a separate signal that says
  # "bump the matrix", not "the run proved nothing". Kept off the PR path for
  # the same reason as the KiCad jobs: someone else's release is not a reason
  # to fail a contributor's pull request.
  # ------------------------------------------------------------------
  tags:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is every pinned image still the newest for its major?
        # Exit 1 = a newer image exists (bump the matrix, re-certify, regenerate
        # the pad table — a KiCad release is exactly when a library rename
        # lands). Exit 2 = a pin does not exist at all, or Docker Hub could not
        # be read; the first would mean the matrix names an image nobody can
        # pull and the job never ran. stdlib-only, so no venv is needed.
        run: python3 tools/check_kicad_tags.py 7.0.11 8.0.9 9.0.9 10.0.5

  # ------------------------------------------------------------------
  # The claim, with provenance. "Verified through 10.0.5" should be a file
  # a machine wrote, not a sentence someone typed.
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # The determinism invariant, measured across platforms for the first time.
  #
  # Page 8 of the architecture document promises that a build is "reproducible
  # forever: no network, no clock, no subprocess, no solver in the compiler, so
  # the same source is the same bytes on any machine, any day." The suite has
  # always checked the WITHIN-machine half — test_double_build_byte_identical
  # rebuilds and compares on whatever machine is running — and never the
  # ACROSS-machine half, which is the half the invariant is actually about and
  # the half a float, an unsorted set, os.linesep or a locale-dependent encode
  # can break without any single machine noticing.
  #
  # No KiCad, no image pull, so it runs on every PR: this is the gate most likely
  # to catch a determinism regression at the moment it is introduced.
  # ------------------------------------------------------------------
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Hash every artifact Ohm can emit
        # Every emit kind, not just `all` — `all` covers netlist, kicad, zen and
        # constraints, while package (which carries the STEP body), eagle, altium
        # and allegro are opt-in. A determinism gate that silently skipped the
        # binary formats would be checking the easy half.
        run: python tools/emit_manifest.py --out manifest-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.os }}
          path: manifest-${{ matrix.os }}.txt

  determinism-compare:
    needs: [determinism]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          merge-multiple: true
      - name: The three platforms must agree byte for byte
        # A differing hash means one platform wrote different bytes for the same
        # source. The tool prints which artifact and both hashes, because "the
        # manifests differ" is not actionable and "divider.kicad_sch differs
        # between ubuntu and windows" is.
        run: |
          ls -l manifest-*.txt
          python tools/emit_manifest.py --check manifest-*.txt

  certify:
    if: github.event_name != 'pull_request'
    needs: [kicad, v007, fpdata, determinism-compare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the certification record
        run: |
          {
            echo "commit:  ${GITHUB_SHA}"
            echo "date:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run:     ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "kicad:   7.0.11, 8.0.9, 9.0.9, 10.0.5 — emit, libraries, read-back, plot"
            echo "v007:    10.0.5 — pcbnew in-process (ubuntu-24.04 PPA)"
            echo "determ:  ubuntu, windows, macos — all eight emit kinds, byte-identical"
            echo "not run: the geometry gate at 7, 8 and 9 — pcbnew is a compiled"
            echo "         extension built against each image's own Python, not Ohm's 3.12"
          } > kicad-certification.txt
          cat kicad-certification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kicad-certification
          path: kicad-certification.txt
